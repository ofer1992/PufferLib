[base]
env_name = aiants

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8
num_policies = 2
hist_policy_percent = 0.15
hist_policy_hidden_size = 128
hist_policy_num_layers = 2

[env]
# 1v1 selfplay: one agent per player
num_agents = 2
# 2-player maps no larger than the compiled grid (AIANTS_GRID, default 32)
map_dir = resources/aiants/maps
turns = 500
cutoff_turn = 150
# Untuned: zero-sum win/loss at game end plus small shaping
reward_win = 1.0
reward_score = 0.1
reward_food = 0.01
reward_kill = 0.01

[selfplay]
enabled = 1
max_size = 16
seed = 42
opp_timeout_steps = 100_000_000
eval_pool_size = 8
eval_games = 1024

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 100_000_000
horizon = 64
